<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>simula.ad</title>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #000;
      overflow: hidden;
    }

    canvas {
      position: absolute;
      display: block;
      touch-action: none;
    }

    #rotate {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9;
      margin: 0;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: #201338;
      color: #fff6e8;
      font: 600 22px Fredoka, system-ui, sans-serif;
      text-align: center;
      user-select: none;
      touch-action: none;
    }

    #rotate.on {
      display: flex;
    }

    #rotate .phone {
      width: 42px;
      height: 72px;
      border: 4px solid #f58324;
      border-radius: 10px;
      animation: sit-up 1.5s ease-in-out infinite;
    }

    @keyframes sit-up {
      0%,
      100% {
        transform: rotate(-90deg);
      }
      40%,
      60% {
        transform: rotate(0);
      }
    }
  </style>
</head>
<body>
  <p id="rotate"><span class="phone"></span>Rotate your phone</p>
  <script src="src/vendor/liquidfun.min.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
